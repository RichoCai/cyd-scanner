name: Build firmware & deploy web flasher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO + esptool
        run: pip install platformio esptool
      - name: Build both board versions
        run: pio run -e cyd -e cyd2usb
      - name: Merge each build into one flashable image
        run: |
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -n1)
          mkdir -p web/firmware
          merge () {
            B=.pio/build/$1
            python -m esptool --chip esp32 merge_bin -o web/firmware/$2 \
              --flash_mode dio --flash_freq 40m --flash_size 4MB \
              0x1000  $B/bootloader.bin \
              0x8000  $B/partitions.bin \
              0xe000  "$BOOT_APP0" \
              0x10000 $B/firmware.bin
          }
          merge cyd     phantom-1usb.bin
          merge cyd2usb phantom-2usb.bin
          ls -la web/firmware
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
